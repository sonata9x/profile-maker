<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>커뮤러 자기소개표 완성본 샘플</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

    :root {
      --point: #7255be;
      --point-soft: #f1edfa;
      --header: #85818d;
      --ink: #171a1f;
      --body: #444951;
      --muted: #777d86;
      --faint: #b5bac1;
      --line: #e2e4e7;
      --panel: #f6f7f8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      padding: 36px;
      overflow-x: auto;
      background: #edf1f6;
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .profile-sheet {
      position: relative;
      width: 1002px;
      min-height: 1287px;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 14px 42px rgba(37,53,83,.1);
    }

    .sheet-header { position: relative; height: 377px; }
    .header-band { position: absolute; inset: 0 0 auto; height: 210px; background: var(--header); }
    .avatar-frame {
      position: absolute; z-index: 2; left: 91px; top: 135px;
      width: 209px; height: 209px; padding: 6px;
      overflow: hidden; border-radius: 50%; background: #fff;
    }
    .avatar-solid { width: 100%; height: 100%; border-radius: 50%; background: #c9c7ce; }
    .identity-block { position: absolute; z-index: 2; left: 332px; top: 249px; width: 560px; }
    .identity-line { min-width: 0; display: flex; align-items: flex-end; gap: 11px; white-space: nowrap; }
    .nickname { color: #101b31; font-size: 24px; font-weight: 800; letter-spacing: .07em; line-height: 30px; }
    .user-id { min-width: 0; overflow: hidden; color: #8d96a7; font-size: 15px; letter-spacing: .05em; line-height: 20px; text-overflow: ellipsis; transform: translateY(-1px); }
    .age-badge { height: 24px; margin-left: 1px; padding: 0 9px; display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; border: 1px solid var(--point); border-radius: 7px; background: #fff; color: var(--point); font-size: 11px; font-weight: 800; line-height: 1; transform: translateY(1px); }
    .activity-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .credit { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 14px; color: #a6a7a9; font-size: 10px; font-weight: 500; }
    .creator-credit { position: absolute; right: 18px; top: 218px; color: #a6a7a9; font-size: 10px; font-weight: 500; }

    .sheet-content { width: 804px; margin-left: 120px; padding-bottom: 82px; }
    .top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: stretch; }
    .top-grid > section:last-child { display: flex; flex-direction: column; }
    .section-title { margin: 0; color: var(--point); font-size: 16px; font-weight: 800; letter-spacing: .105em; line-height: 22px; }
    .section-title.with-icon { display: flex; align-items: center; gap: 7px; }
    .section-title .title-icon { flex: 0 0 auto; font-size: 14px; letter-spacing: 0; line-height: 22px; transform: translateY(-1px); }
    .section-body { margin-top: 16px; display: grid; gap: 12px; }
    .field-row { min-height: 27px; display: grid; grid-template-columns: 74px minmax(0,1fr); gap: 12px; align-items: start; }
    .field-label { min-height: 27px; display: flex; align-items: center; color: var(--body); font-size: 13px; font-weight: 600; line-height: 1; }
    .button-group { min-width: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .sheet-chip {
      min-width: 0; height: 27px; padding: 0 12px; display: inline-flex;
      align-items: center; justify-content: center; border: 1px solid #dfe3e8;
      border-radius: 8px; background: #fff; color: var(--faint); white-space: nowrap;
      text-align: center; font-size: 13px; font-weight: 600; line-height: 1;
    }
    .sheet-chip.is-selected { border-color: transparent; background: var(--point-soft); color: var(--point); }
    .tweet-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tweet-chips .sheet-chip { padding: 0 11px; }

    .meter-wrap { margin-top: 2px; align-items: center; }
    .meter-wrap .field-label { min-height: 27px; align-items: center; }
    .meter-line { min-height: 27px; display: grid; grid-template-columns: 32px 1fr 32px; gap: 8px; align-items: center; }
    .meter-caption { color: var(--muted); font-size: 10px; text-align: center; }
    .meter-track { position: relative; height: 8px; border-radius: 999px; background: #e8e8eb; }
    .meter-fill { width: 72%; height: 100%; border-radius: inherit; background: var(--point); }
    .notice-stack { width: 100%; min-height: 0; align-self: stretch; display: grid; grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 18px; }
    .notice-wrap { min-height: 0; display: flex; flex-direction: column; }
    .notice-wrap .text-card { min-height: 122px; flex: 1 1 auto; margin-top: 9px; }
    .card-copy { margin: 0; color: var(--body); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; line-height: 23.5px; }

    .wide-section { margin-top: 34px; }
    .text-card { min-height: 112px; margin-top: 10px; padding: 17px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .genre-card { min-height: 105px; }
    .memo-card { min-height: 122px; }

    .gallery-section { margin-top: 22px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .gallery-item { min-width: 0; display: grid; gap: 3px; }
    .gallery-image { height: 138px; overflow: hidden; border-radius: 10px; background: var(--swatch); }
    .gallery-credit { justify-self: end; margin-right: 3px; color: #a6a7a9; font-size: 9px; font-weight: 500; line-height: 14px; }
    .gallery-item:nth-child(1) .gallery-image { --swatch: #c4bfce; }
    .gallery-item:nth-child(2) .gallery-image { --swatch: #a9b4c8; }
    .gallery-item:nth-child(3) .gallery-image { --swatch: #c7b7bb; }

    @media (max-width: 1080px) {
      body { padding: 16px; }
      .profile-sheet { margin: 0; }
    }
  </style>
</head>
<body>
  <article class="profile-sheet" aria-label="커뮤러 자기소개표 완성본">
    <header class="sheet-header">
      <div class="header-band"></div>
      <div class="avatar-frame"><div class="avatar-solid"></div></div>
      <div class="identity-block">
        <div class="identity-line">
          <strong class="nickname">닉네임</strong>
          <span class="user-id">@user_id</span>
          <span class="age-badge">성인</span>
        </div>
        <div class="activity-tags">
          <span class="sheet-chip is-selected">글</span>
          <span class="sheet-chip is-selected">그림</span>
          <span class="sheet-chip is-selected">디자인</span>
        </div>
        <div class="credit"><span>프로필 ⓒ커미션출처</span><span>헤더 ⓒ커미션출처</span></div>
      </div>
      <div class="creator-credit">제작 ソナ @sonata9x</div>
    </header>

    <div class="sheet-content">
      <div class="top-grid">
        <section>
          <h2 class="section-title">ABOUT ME</h2>
          <div class="section-body">
            <div class="field-row">
              <div class="field-label">장르</div>
              <div class="button-group">
                <span class="sheet-chip is-selected">1차</span><span class="sheet-chip is-selected">2차</span><span class="sheet-chip">드림</span>
              </div>
            </div>
            <div class="field-row">
              <div class="field-label">커플링</div>
              <div class="button-group">
                <span class="sheet-chip is-selected">BL</span><span class="sheet-chip is-selected">HL</span><span class="sheet-chip is-selected">GL</span><span class="sheet-chip is-selected">논컾</span><span class="sheet-chip">기타</span>
              </div>
            </div>
            <div class="field-row">
              <div class="field-label">리버스</div>
              <div class="button-group"><span class="sheet-chip is-selected">O</span><span class="sheet-chip">X</span><span class="sheet-chip">기타</span></div>
            </div>
            <div class="field-row">
              <div class="field-label">이별</div>
              <div class="button-group"><span class="sheet-chip">블락</span><span class="sheet-chip is-selected">블언블</span><span class="sheet-chip">언팔로우</span></div>
            </div>
            <div class="field-row">
              <div class="field-label">트윗 성향</div>
              <div class="tweet-chips">
                <span class="sheet-chip is-selected">RT</span><span class="sheet-chip is-selected">마음</span><span class="sheet-chip is-selected">일상</span><span class="sheet-chip">구독</span>
                <span class="sheet-chip is-selected">연성</span><span class="sheet-chip is-selected">썰</span><span class="sheet-chip">욕설</span><span class="sheet-chip">우울</span>
                <span class="sheet-chip">수위</span><span class="sheet-chip is-selected">탐라대화</span><span class="sheet-chip is-selected">앓이</span>
              </div>
            </div>
            <div class="field-row meter-wrap">
              <div class="field-label">타장르 언급</div>
              <div class="meter-line">
                <span class="meter-caption">없음</span>
                <div class="meter-track"><div class="meter-fill"></div></div>
                <span class="meter-caption">많음</span>
              </div>
            </div>
          </div>
        </section>

        <section class="notice-stack">
          <div class="notice-wrap">
            <h2 class="section-title with-icon"><span class="title-icon" aria-hidden="true">♥</span><span>LIKE</span></h2>
            <div class="text-card">
              <p class="card-copy">선호 기입</p>
            </div>
          </div>
          <div class="notice-wrap">
            <h2 class="section-title with-icon"><span class="title-icon" aria-hidden="true">✕</span><span>NG / 트리거</span></h2>
            <div class="text-card">
              <p class="card-copy">불호 기입</p>
            </div>
          </div>
        </section>
      </div>

      <section class="wide-section">
        <h2 class="section-title">MEMO</h2>
        <div class="text-card memo-card">
          <p class="card-copy">메모 기입</p>
        </div>
      </section>

      <section class="wide-section">
        <h2 class="section-title">장르</h2>
        <div class="text-card genre-card">
          <p class="card-copy">장르 관련 소개글</p>
        </div>
      </section>

      <section class="gallery-section" aria-label="장르 이미지 갤러리">
        <div class="gallery-grid">
          <div class="gallery-item"><div class="gallery-image"></div><span class="gallery-credit">ⓒ커미션출처</span></div>
          <div class="gallery-item"><div class="gallery-image"></div><span class="gallery-credit">ⓒ커미션출처</span></div>
          <div class="gallery-item"><div class="gallery-image"></div><span class="gallery-credit">ⓒ커미션출처</span></div>
        </div>
      </section>
    </div>
  </article>
</body>
</html>
